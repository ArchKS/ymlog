# ---------------------------------------------------------------------------------------
#  Your basic info
# ---------------------------------------------------------------------------------------
base_info:
  title: Zendu
  author: Zendu
  url: https://ymlog.cn/
  # Logo image (You can use local image, image external link or don’t fill)
  logo_img: /images/avatar.jpg

# ---------------------------------------------------------------------------------------
# Theme style settings
# ---------------------------------------------------------------------------------------
style:
  # Theme primary color
  primary_color: "#0066CC"

  # Avatar (You can use local image or image external link)
  avatar: /images/avatar.jpg

  # Favicon (You can use local image or image external link)
  favicon: /images/logo.svg

  # 印章图片（base64 data URI，或图片路径如 /img/stamp.png）
  stamp: "data:image/webp;base64,"

  # Article image align position, value: left | center
  article_img_align: left

  # Left side width
  left_side_width: 260px

  # Content area width (PC 百分比) & max width
  content_width: 80%
  # content_max_width 不配置则无上限
  # content_max_width: 920px

  # Read 书单页单独调整（可选，不配置则跟随上面全局值）
  read_content_width: 84%
  # read_content_max_width: 1400px

  # Mouse hover
  hover:
    shadow: false # shadow effect when the mouse hover
    scale: false # scale effect when the mouse hover

  # First screen
  first_screen:
    enable: false
    background_img: /images/bg.svg # You can use local image or image external link
    description: 判天地之美，析万物之理。

  # Scroll style settings
  scroll:
    progress_bar:
      enable: false
    percent:
      enable: false

# ---------------------------------------------------------------------------------------
# Social contact link
# ---------------------------------------------------------------------------------------
social_contact:
  enable: false
  links:
    github: # your GitHub URL
    weixin: # your WeChat QR-Code URL
    qq: /images/QQ.jpg # your QQ QR-Code URL
    weibo: # your WeiBo URL
    zhihu: # your ZhiHu URL
    twitter: # your twitter URL
    facebook: # your facebook URL
    email: # your email

# ---------------------------------------------------------------------------------------
# Navigation menu
# ---------------------------------------------------------------------------------------
menu:
  Home: /
  Archives: /archives
  Categories: /categories/
  # Tags: /tags
  # Links: /links
  # About: /about
  # Changelog: /changelog
  # ......

# ---------------------------------------------------------------------------------------
# Home page article block display settings
# ---------------------------------------------------------------------------------------
home_article:
  category:
    enable: true # show category in home page article block
    limit: 3 # max number of categories shown in home page article block
  tag:
    enable: false # show tags in home page article block
    limit: 5 # max number of tags shown in home page article block

# ---------------------------------------------------------------------------------------
# Post page Settings
# ---------------------------------------------------------------------------------------
post:
  # Post word count
  # Dependencies: hexo-wordcount (npm install hexo-wordcount)
  # See: https://github.com/willin/hexo-wordcount
  word_count:
    enable: false
    wordcount: false # word count, one article
    min2read: false # time to read, one article

  # Author label
  author_label:
    enable: true
    auto: true # if true, show Lv1, Lv2, Lv3... , If false, show custom label
    # label array item can be one or more
    custom_label_list: ["Trainee", "Engineer", "Architect", "CTO", "BOSS"]

# ---------------------------------------------------------------------------------------
# Code copy
# ---------------------------------------------------------------------------------------
code_copy:
  enable: false
  style: default # values: default | mac

# ---------------------------------------------------------------------------------------
# Table of Contents in the Sidebar
# ---------------------------------------------------------------------------------------
toc:
  enable: true

  # Automatically add list number to toc.
  number: false

  # If true, all level of TOC in a post will be displayed, rather than the activated part of it.
  expand_all: true

  # If true, open TOC every time when you enter the article page
  init_open: true

# ---------------------------------------------------------------------------------------
# Post copyright info
# ---------------------------------------------------------------------------------------
copyright_info:
  enable: false

# ---------------------------------------------------------------------------------------
# Website count
# ---------------------------------------------------------------------------------------
website_count:
  # busuanzi
  # See: http://ibruce.info/2015/04/04/busuanzi/
  busuanzi_count:
    enable: false
    site_uv: false
    site_pv: false
    page_pv: false

# ---------------------------------------------------------------------------------------
# Local Search
# Dependencies: hexo-generator-searchdb
# See: https://github.com/theme-next/hexo-generator-searchdb
# ---------------------------------------------------------------------------------------
local_search:
  enable: false
  preload: false # Preload the search data when the page loads

# ---------------------------------------------------------------------------------------
# Comment plugin
# ---------------------------------------------------------------------------------------
comment:
  enable: false
  use: valine # values: valine | gitalk | twikoo

  # Valine
  # See: https://github.com/xCss/Valine
  valine:
    appid: # your leancloud application appid
    appkey: # your leancloud application appkey
    placeholder: # your placeholder

  # Gitalk
  # See: https://github.com/gitalk/gitalk
  gitalk:
    github_id: # GitHub repo owner
    repository: # Repository name to store issues
    client_id: # GitHub Application Client ID
    client_secret: # GitHub Application Client Secret

  # Twikoo
  # See: https://github.com/imaegoo/twikoo
  twikoo:
    env_id: # Tencent Cloud environment id
    region: # environment region. If select Guangzhou, fill in "ap-guangzhou".

# ---------------------------------------------------------------------------------------
# RSS
# Dependencies: hexo-generator-feed
# See: https://github.com/hexojs/hexo-generator-feed
# ---------------------------------------------------------------------------------------
rss:
  enable: false

# ---------------------------------------------------------------------------------------
# Lazyload image
# ---------------------------------------------------------------------------------------
lazyload:
  enable: false

# ---------------------------------------------------------------------------------------
# CDN
# ---------------------------------------------------------------------------------------
cdn:
  enable: false

# ---------------------------------------------------------------------------------------
# PJAX
# ---------------------------------------------------------------------------------------
pjax:
  enable: false

# ---------------------------------------------------------------------------------------
# Footer settings
# ---------------------------------------------------------------------------------------
footer:
  since: 2017 # the starting year of your website, Can be null
  icp: # ICP record number of your website, Can be null
  upyun: # url

# ---------------------------------------------------------------------------------------
# Read 书单页列显示配置
# web = 桌面端, h5 = 手机端（宽度 <= 768px）
# 可选列：序号 / 年份 / 分类 / 作者 / 书名 / 评级 / 日期 / 时长 / 字数 / 速度 / 日均时长
# 说明：「年份」列只在合并视图（评级/分类排序）中有效，原始年份表的年份是 H2 标题不受影响；
#       合并视图中「序号」同时控制结构序号列（评级排序显示为"排名"，分类排序显示为分类内序号）；
#       「速度」「日均时长」为计算列（无需写进 Read.md）：
#         速度 = 字数 / 时长，单位 万字/小时；
#         日均时长 = 时长 / 日期间隔天数，输出十进制小时（如 1.5h 表示每天 1小时30分）；
#       时长格式 H:MM（如 1:45 表示 1小时45分），字数支持 25.4万 / 25.4万字 / 254000 / 25.4 四种写法；
#       日期支持 2026-10-15 / 10.15 / 10-15 / 10/15 / 10月15日；写区间（如 10.01~10.15）时取范围天数，
#       写单日期时取与上一本书日期的间隔天数（每年第一本留空），不足 1 天按 1 天计
# ---------------------------------------------------------------------------------------
read_booklist:
  columns:
    web: [序号, 分类, 作者, 书名, 评级, 速度, 日均时长]
    h5: [分类, 作者, 书名, 评级]
  # 筛选徽章：数量小于该值的分类/评级不展示（默认 1 即全部展示）
  filter_min_count: 2
  # 列宽比例（可选，不配置则自动布局）：按列名设置，只对「实际显示的列」生效，
  # 未配置的列按 1 计；隐藏/未显示的列自动跳过，其比例不参与分配
  widths:
    web:
      序号: 0.5
      分类: 1
      作者: 2
      书名: 4
      评级: 1.2
      速度: 1
      日均时长: 1.2
    h5:
      序号: 1
      分类: 1
      作者: 1
      书名: 2.8
      评级: 1.2
      速度: 1
      日均时长: 1
  # 列对齐方式（可选）：按列名设置，取值 left / center / right，未配置的列保持默认左对齐
  aligns:
    web:
      序号: center
      评级: right
      速度: center
      日均时长: center
    h5:
      序号: center
      评级: right
      速度: center
      日均时长: center

# ---------------------------------------------------------------------------------------
# Keep version (Please don't modify)
# ---------------------------------------------------------------------------------------
version: 3.4.5
